<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <link rel="apple-touch-icon" href="/logo.svg" />

  <!-- SEO Meta Tags -->
  <meta name="description"
    content="CatCoder - Learn Python programming through interactive lessons, coding challenges, and gamified learning. Master coding with your paw!" />
  <meta name="keywords"
    content="learn python, coding, programming, interactive learning, coding challenges, gamified learning" />
  <meta name="author" content="CatCoder" />

  <!-- Open Graph / Social Media -->
  <meta property="og:title" content="CatCoder - Code with your paw!" />
  <meta property="og:description"
    content="Learn Python programming through interactive lessons and coding challenges." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/logo.svg" />

  <!-- Content Security Policy -->
  <!-- 
    CSP Configuration (Requirements 4.1-4.6):
    - default-src 'none': Deny all resources not explicitly allowed
    - script-src: 'self' + 'unsafe-eval' (required for code execution) + CDNs for Pyodide/Monaco
    - style-src: 'self' + 'unsafe-inline' + CDNs for Monaco Editor CSS
    - font-src: 'self' + Google Fonts
    - connect-src: 'self' + Supabase domains + Pyodide CDN
    - img-src: 'self' + data URIs + Supabase storage + common avatar providers
    - worker-src: 'self' + blob: (required for Web Workers)
    - frame-src: 'none' (no iframes allowed)
  -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net https://pyodide.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://pyodide.org https://api.openai.com; img-src 'self' data: blob: https://*.supabase.co https://*.googleusercontent.com https://*.githubusercontent.com https://*.gravatar.com https://avatars.githubusercontent.com https://lh3.googleusercontent.com; worker-src 'self' blob:; manifest-src 'self' https://catcoderr.netlify.app; frame-src 'none'; base-uri 'self'; form-action 'self';" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
  <title>CatCoder - Code with your paw!</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
