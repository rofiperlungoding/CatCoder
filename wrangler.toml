# Cloudflare Workers configuration
#
# One Worker serves the SPA (static assets from ./dist) AND the /api/* routes.
# run_worker_first makes the Worker handle /api/* while everything else is
# served as a static asset with single-page-application fallback.
#
# Deploy:   npm run cf:deploy
# Dev:      npm run cf:dev   (after npm run build)
# Schema:   npm run cf:schema

name = "catcoder"
account_id = "45a6a83b7da670c16eaac989170e06b7"
main = "worker/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Public, non-secret vars. Secrets (LIBSQL_DB_AUTH_TOKEN, AUTH_SECRET,
# MISTRAL_API_KEY, TURNSTILE_SECRET) are set via
# `npx wrangler secret put <NAME>` and, for local dev, in worker/.dev.vars.
[vars]
LIBSQL_DB_URL = "libsql://catcoder-rofidarmawan.aws-ap-northeast-1.turso.io"
# Comma-separated CORS allowlist. Every origin that serves the SPA must be
# listed; /api responses echo the request Origin only when it appears here.
ALLOWED_ORIGINS = "https://catcoder.online,https://www.catcoder.online"

# Workers KV namespace used for abuse control and rate limiting.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "72707135c41f4422831b2afc42b2b1ed"

[observability]
enabled = true

# Custom domain (catcoder.online).
[[routes]]
pattern = "catcoder.online"
custom_domain = true

[[routes]]
pattern = "www.catcoder.online"
custom_domain = true
