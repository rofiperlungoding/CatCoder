# Cloudflare Workers configuration
#
# One Worker serves the SPA (static assets from ./dist) AND the /api/* routes.
# run_worker_first makes the Worker handle /api/* while everything else is
# served as a static asset with single-page-application fallback.
#
# Deploy:   npm run cf:deploy
# Dev:      npm run cf:dev   (after npm run build)
# Schema:   npm run cf:schema

name = "catcoder"
account_id = "45a6a83b7da670c16eaac989170e06b7"
main = "worker/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Public, non-secret vars. Secrets (LIBSQL_DB_AUTH_TOKEN, AUTH_SECRET,
# MISTRAL_API_KEY, TURNSTILE_SECRET) are set via
# `npx wrangler secret put <NAME>` and, for local dev, in worker/.dev.vars.
[vars]
LIBSQL_DB_URL = "libsql://catcoder-rofidarmawan.aws-ap-northeast-1.turso.io"
# Judge model for the Bug Arena (free-tier friendly default; the paid-only
# mistral-large-latest returns 403 on free keys). Override via secret/vars.
MISTRAL_MODEL = "codestral-latest"
# Comma-separated CORS allowlist. Every origin that serves the SPA must be
# listed; /api responses echo the request Origin only when it appears here.
ALLOWED_ORIGINS = "https://catcoder.online,https://www.catcoder.online"

# Workers KV namespace (legacy, kept for rollback) — the authoritative
# limiter is now the RATE_LIMITER_DO Durable Object below.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "72707135c41f4422831b2afc42b2b1ed"

# Durable Object backing the rate limiter. One DO instance per identity
# ("judge:<ip>", "signin:email:<addr>", "signin:ip:<addr>"), so the window
# counter is exact across every Worker isolate — KV alone is eventually
# consistent and lets concurrent requests race past the limit.
[[durable_objects.bindings]]
name = "RATE_LIMITER_DO"
class_name = "RateLimiterDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiterDurableObject"]

[observability]
enabled = true

# Custom domain (catcoder.online).
[[routes]]
pattern = "catcoder.online"
custom_domain = true

[[routes]]
pattern = "www.catcoder.online"
custom_domain = true
