name: "🚀 Universal CI/CD Pipeline"

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  validate-all:
    name: "🛡️ Setup, Security, Quality & Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── Inject Env ──
      - name: Inject Secure Environment Variables
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY }}
          VITE_STORAGE_ENCRYPTION_KEY: ${{ secrets.VITE_STORAGE_ENCRYPTION_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> .env
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> .env
          echo "VITE_OPENAI_API_KEY=$VITE_OPENAI_API_KEY" >> .env
          echo "VITE_STORAGE_ENCRYPTION_KEY=$VITE_STORAGE_ENCRYPTION_KEY" >> .env
          echo "VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID" >> .env
          echo "VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID" >> .env

      # ── Setup Runtimes ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── Install Dependencies ──
      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Quality Tools
        run: pip install ruff mypy pydantic safety bandit

      # ══════════════════════════════════════════
      #  CHECK 1: Supply Chain (NPM Audit)
      # ══════════════════════════════════════════
      - name: "🔍 NPM Security Audit"
        id: npm_audit
        continue-on-error: true
        run: |
          set +e
          npm audit --json > audit_raw.json 2>&1 || true
          set -e
          CRITICAL=$(cat audit_raw.json | jq '.metadata.vulnerabilities.critical // 0' 2>/dev/null || true)
          [ -z "$CRITICAL" ] && CRITICAL=0
          HIGH=$(cat audit_raw.json | jq '.metadata.vulnerabilities.high // 0' 2>/dev/null || true)
          [ -z "$HIGH" ] && HIGH=0
          MODERATE=$(cat audit_raw.json | jq '.metadata.vulnerabilities.moderate // 0' 2>/dev/null || true)
          [ -z "$MODERATE" ] && MODERATE=0
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "moderate=$MODERATE" >> $GITHUB_OUTPUT
          if [ "$CRITICAL" -gt 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          elif [ "$HIGH" -gt 0 ]; then
            echo "status=WARN" >> $GITHUB_OUTPUT
          elif [ "$MODERATE" -gt 0 ]; then
            echo "status=WARN" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 2: Secrets Leakage Scan (Gitleaks)
      # ══════════════════════════════════════════
      - name: "🕵️ Secrets Leakage Scan"
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record Gitleaks Result
        if: always()
        id: gitleaks_result
        run: |
          if [ "${{ steps.gitleaks.outcome }}" = "failure" ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 3: ESLint (Frontend)
      # ══════════════════════════════════════════
      - name: "📏 ESLint — Zero Tolerance"
        id: lint
        continue-on-error: true
        run: |
          set +e
          npm run lint 2>&1 | tee lint_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          WARNINGS=$(grep -c "warning" lint_output.txt 2>/dev/null || true)
          [ -z "$WARNINGS" ] && WARNINGS=0
          ERRORS=$(grep -c " error " lint_output.txt 2>/dev/null || true)
          [ -z "$ERRORS" ] && ERRORS=0
          echo "warnings=${WARNINGS}" >> $GITHUB_OUTPUT
          echo "errors=${ERRORS}" >> $GITHUB_OUTPUT
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          elif [ "$WARNINGS" -gt 0 ]; then
            echo "status=WARN" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 4: TypeScript (Frontend)
      # ══════════════════════════════════════════
      - name: "🔧 TypeScript Strict Check"
        id: typecheck
        continue-on-error: true
        run: |
          set +e
          npx tsc -b 2>&1 | tee typecheck_output.txt
          EXIT_CODE=$?
          set -e
          TS_ERRORS=$(grep -c "error TS" typecheck_output.txt 2>/dev/null || true)
          [ -z "$TS_ERRORS" ] && TS_ERRORS=0
          echo "errors=${TS_ERRORS}" >> $GITHUB_OUTPUT
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 5: Pentest Suite
      # ══════════════════════════════════════════
      - name: "⚔️ Pentest Suite"
        id: pentest
        continue-on-error: true
        run: |
          set +e
          npx vitest run --config vitest.pentest.config.ts 2>&1 | tee pentest_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          PASSED=$(grep -oP '\d+(?=\s+passed)' pentest_output.txt | head -1 || true)
          [ -z "$PASSED" ] && PASSED=0
          FAILED=$(grep -oP '\d+(?=\s+failed)' pentest_output.txt | head -1 || true)
          [ -z "$FAILED" ] && FAILED=0
          echo "passed=${PASSED}" >> $GITHUB_OUTPUT
          echo "failed=${FAILED}" >> $GITHUB_OUTPUT
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 6: Python Linting (Ruff)
      # ══════════════════════════════════════════
      - name: "📏 Python Linting (Ruff)"
        id: ruff
        continue-on-error: true
        run: |
          set +e
          ruff check src/lib/secure_core.py 2>&1 | tee ruff_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 7: Python Type Safety (MyPy)
      # ══════════════════════════════════════════
      - name: "🔧 Python Type Safety (MyPy)"
        id: mypy
        continue-on-error: true
        run: |
          set +e
          mypy src/lib/secure_core.py 2>&1 | tee mypy_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 8: Python Security Audit (Bandit)
      # ══════════════════════════════════════════
      - name: "🔒 Python Security Audit (Bandit)"
        id: bandit
        continue-on-error: true
        run: |
          set +e
          bandit src/lib/secure_core.py 2>&1 | tee bandit_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 9: Python Logic Fuzzing
      # ══════════════════════════════════════════
      - name: "🎲 Python Logic Fuzzing"
        id: fuzz
        continue-on-error: true
        run: |
          set +e
          python src/lib/fuzz_logic.py 2>&1 | tee fuzz_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 10: Production Build Verification
      # ══════════════════════════════════════════
      - name: "🏗️ Production Build Verification"
        id: build
        continue-on-error: true
        run: |
          set +e
          npm run build 2>&1 | tee build_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            TOTAL_SIZE=$(du -sb dist/ | cut -f1)
            SIZE_MB=$(echo "scale=2; $TOTAL_SIZE / 1048576" | bc)
            echo "bundle_size=${SIZE_MB}MB" >> $GITHUB_OUTPUT
            if (( $(echo "$SIZE_MB > 5.0" | bc -l) )); then
              echo "status=WARN" >> $GITHUB_OUTPUT
            else
              echo "status=PASS" >> $GITHUB_OUTPUT
            fi
          fi

      # ══════════════════════════════════════════
      #  CHECK 11: Generate SBOM
      # ══════════════════════════════════════════
      - name: "📦 Generate SBOM"
        uses: anchore/sbom-action@v0
        with:
          format: 'cyclonedx-json'
          output-file: 'sbom.json'

      # ── Upload Artifacts ──
      - name: Upload Build Artifacts
        if: steps.build.outputs.status != 'FAIL'
        uses: actions/upload-artifact@v4
        with:
          name: production-assets
          path: |
            dist/
            sbom.json

      # ── Generate Report ──
      - name: "📋 Generate Comprehensive Report"
        if: always()
        id: report
        env:
          NPM_STATUS: ${{ steps.npm_audit.outputs.status }}
          NPM_CRITICAL: ${{ steps.npm_audit.outputs.critical }}
          NPM_HIGH: ${{ steps.npm_audit.outputs.high }}
          NPM_MODERATE: ${{ steps.npm_audit.outputs.moderate }}
          GITLEAKS_STATUS: ${{ steps.gitleaks_result.outputs.status }}
          LINT_STATUS: ${{ steps.lint.outputs.status }}
          LINT_ERRORS: ${{ steps.lint.outputs.errors }}
          LINT_WARNINGS: ${{ steps.lint.outputs.warnings }}
          TYPECHECK_STATUS: ${{ steps.typecheck.outputs.status }}
          TYPECHECK_ERRORS: ${{ steps.typecheck.outputs.errors }}
          PENTEST_STATUS: ${{ steps.pentest.outputs.status }}
          PENTEST_FAILED: ${{ steps.pentest.outputs.failed }}
          PENTEST_PASSED: ${{ steps.pentest.outputs.passed }}
          RUFF_STATUS: ${{ steps.ruff.outputs.status }}
          MYPY_STATUS: ${{ steps.mypy.outputs.status }}
          BANDIT_STATUS: ${{ steps.bandit.outputs.status }}
          FUZZ_STATUS: ${{ steps.fuzz.outputs.status }}
          BUILD_STATUS: ${{ steps.build.outputs.status }}
          BUILD_SIZE: ${{ steps.build.outputs.bundle_size }}
        run: bash .github/scripts/generate_email.sh

      # ── Send Final Report Email ──
      - name: "📧 Send Comprehensive Email"
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ steps.report.outputs.overall }} — CatCoder CI [${{ github.ref_name }}]"
          html_body: file://email_body.html
          to: opikopi32@gmail.com, mrofid@student.ub.ac.id
          from: "CatCoder Guardian <${{ secrets.MAIL_USERNAME }}>"

      # ── Final Verdict ──
      - name: "🏁 Final Verdict"
        if: always()
        run: |
          if [ "${{ steps.npm_audit.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.gitleaks_result.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.lint.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.typecheck.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.pentest.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.ruff.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.mypy.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.bandit.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.fuzz.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.build.outputs.status }}" = "FAIL" ]; then
            echo "🚨 PIPELINE OVERALL FAILED — Fix critical issues above."
            exit 1
          fi
          echo "✅ ALL PIPELINES CLEAR."

  release:
    name: "📦 Create GitHub Release"
    needs: validate-all
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-assets
          path: dist/

      - name: Archive Assets
        run: zip -r release-assets.zip dist/ sbom.json

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
