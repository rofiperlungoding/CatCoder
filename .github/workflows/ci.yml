name: "🚀 Universal CI/CD Pipeline"

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  validate-all:
    name: "🛡️ Setup, Security, Quality & Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── Inject Env ──
      - name: Inject Secure Environment Variables
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY }}
          VITE_STORAGE_ENCRYPTION_KEY: ${{ secrets.VITE_STORAGE_ENCRYPTION_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> .env
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> .env
          echo "VITE_OPENAI_API_KEY=$VITE_OPENAI_API_KEY" >> .env
          echo "VITE_STORAGE_ENCRYPTION_KEY=$VITE_STORAGE_ENCRYPTION_KEY" >> .env
          echo "VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID" >> .env
          echo "VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID" >> .env

      # ── Setup Runtimes ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── Install Dependencies ──
      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Quality Tools
        run: pip install ruff mypy pydantic safety bandit

      # ══════════════════════════════════════════
      #  CHECK 1: Supply Chain (NPM Audit)
      # ══════════════════════════════════════════
      - name: "🔍 NPM Security Audit"
        id: npm_audit
        continue-on-error: true
        run: |
          set +e
          npm audit --json > audit_raw.json 2>&1 || true
          set -e
          CRITICAL=$(cat audit_raw.json | jq '.metadata.vulnerabilities.critical // 0' 2>/dev/null || true)
          [ -z "$CRITICAL" ] && CRITICAL=0
          HIGH=$(cat audit_raw.json | jq '.metadata.vulnerabilities.high // 0' 2>/dev/null || true)
          [ -z "$HIGH" ] && HIGH=0
          MODERATE=$(cat audit_raw.json | jq '.metadata.vulnerabilities.moderate // 0' 2>/dev/null || true)
          [ -z "$MODERATE" ] && MODERATE=0
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "moderate=$MODERATE" >> $GITHUB_OUTPUT
          if [ "$CRITICAL" -gt 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          elif [ "$HIGH" -gt 0 ]; then
            echo "status=WARN" >> $GITHUB_OUTPUT
          elif [ "$MODERATE" -gt 0 ]; then
            echo "status=WARN" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 2: Secrets Leakage Scan (Gitleaks)
      # ══════════════════════════════════════════
      - name: "🕵️ Secrets Leakage Scan"
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record Gitleaks Result
        if: always()
        id: gitleaks_result
        run: |
          if [ "${{ steps.gitleaks.outcome }}" = "failure" ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 3: ESLint (Frontend)
      # ══════════════════════════════════════════
      - name: "📏 ESLint — Zero Tolerance"
        id: lint
        continue-on-error: true
        run: |
          set +e
          npm run lint 2>&1 | tee lint_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          WARNINGS=$(grep -c "warning" lint_output.txt 2>/dev/null || true)
          [ -z "$WARNINGS" ] && WARNINGS=0
          ERRORS=$(grep -c " error " lint_output.txt 2>/dev/null || true)
          [ -z "$ERRORS" ] && ERRORS=0
          echo "warnings=${WARNINGS}" >> $GITHUB_OUTPUT
          echo "errors=${ERRORS}" >> $GITHUB_OUTPUT
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          elif [ "$WARNINGS" -gt 0 ]; then
            echo "status=WARN" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 4: TypeScript (Frontend)
      # ══════════════════════════════════════════
      - name: "🔧 TypeScript Strict Check"
        id: typecheck
        continue-on-error: true
        run: |
          set +e
          npx tsc -b 2>&1 | tee typecheck_output.txt
          EXIT_CODE=$?
          set -e
          TS_ERRORS=$(grep -c "error TS" typecheck_output.txt 2>/dev/null || true)
          [ -z "$TS_ERRORS" ] && TS_ERRORS=0
          echo "errors=${TS_ERRORS}" >> $GITHUB_OUTPUT
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 5: Pentest Suite
      # ══════════════════════════════════════════
      - name: "⚔️ Pentest Suite"
        id: pentest
        continue-on-error: true
        run: |
          set +e
          npx vitest run --config vitest.pentest.config.ts 2>&1 | tee pentest_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          PASSED=$(grep -oP '\d+(?=\s+passed)' pentest_output.txt | head -1 || true)
          [ -z "$PASSED" ] && PASSED=0
          FAILED=$(grep -oP '\d+(?=\s+failed)' pentest_output.txt | head -1 || true)
          [ -z "$FAILED" ] && FAILED=0
          echo "passed=${PASSED}" >> $GITHUB_OUTPUT
          echo "failed=${FAILED}" >> $GITHUB_OUTPUT
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 6: Python Linting (Ruff)
      # ══════════════════════════════════════════
      - name: "📏 Python Linting (Ruff)"
        id: ruff
        continue-on-error: true
        run: |
          set +e
          ruff check src/lib/secure_core.py 2>&1 | tee ruff_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 7: Python Type Safety (MyPy)
      # ══════════════════════════════════════════
      - name: "🔧 Python Type Safety (MyPy)"
        id: mypy
        continue-on-error: true
        run: |
          set +e
          mypy src/lib/secure_core.py 2>&1 | tee mypy_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 8: Python Security Audit (Bandit)
      # ══════════════════════════════════════════
      - name: "🔒 Python Security Audit (Bandit)"
        id: bandit
        continue-on-error: true
        run: |
          set +e
          bandit src/lib/secure_core.py 2>&1 | tee bandit_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 9: Python Logic Fuzzing
      # ══════════════════════════════════════════
      - name: "🎲 Python Logic Fuzzing"
        id: fuzz
        continue-on-error: true
        run: |
          set +e
          python src/lib/fuzz_logic.py 2>&1 | tee fuzz_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 10: Production Build Verification
      # ══════════════════════════════════════════
      - name: "🏗️ Production Build Verification"
        id: build
        continue-on-error: true
        run: |
          set +e
          npm run build 2>&1 | tee build_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            TOTAL_SIZE=$(du -sb dist/ | cut -f1)
            SIZE_MB=$(echo "scale=2; $TOTAL_SIZE / 1048576" | bc)
            echo "bundle_size=${SIZE_MB}MB" >> $GITHUB_OUTPUT
            if (( $(echo "$SIZE_MB > 5.0" | bc -l) )); then
              echo "status=WARN" >> $GITHUB_OUTPUT
            else
              echo "status=PASS" >> $GITHUB_OUTPUT
            fi
          fi

      # ══════════════════════════════════════════
      #  CHECK 11: Generate SBOM
      # ══════════════════════════════════════════
      - name: "📦 Generate SBOM"
        uses: anchore/sbom-action@v0
        with:
          format: 'cyclonedx-json'
          output-file: 'sbom.json'

      # ── Upload Artifacts ──
      - name: Upload Build Artifacts
        if: steps.build.outputs.status != 'FAIL'
        uses: actions/upload-artifact@v4
        with:
          name: production-assets
          path: |
            dist/
            sbom.json

      # ── Generate Report ──
      - name: "📋 Generate Comprehensive Report"
        if: always()
        id: report
        run: |
          HAS_FAIL="false"
          HAS_WARN="false"

          declare -A CHECK_STATUS
          CHECK_STATUS[npm_audit]="${{ steps.npm_audit.outputs.status }}"
          CHECK_STATUS[gitleaks]="${{ steps.gitleaks_result.outputs.status }}"
          CHECK_STATUS[lint]="${{ steps.lint.outputs.status }}"
          CHECK_STATUS[typecheck]="${{ steps.typecheck.outputs.status }}"
          CHECK_STATUS[pentest]="${{ steps.pentest.outputs.status }}"
          CHECK_STATUS[ruff]="${{ steps.ruff.outputs.status }}"
          CHECK_STATUS[mypy]="${{ steps.mypy.outputs.status }}"
          CHECK_STATUS[bandit]="${{ steps.bandit.outputs.status }}"
          CHECK_STATUS[fuzz]="${{ steps.fuzz.outputs.status }}"
          CHECK_STATUS[build]="${{ steps.build.outputs.status }}"

          for check in "${!CHECK_STATUS[@]}"; do
            if [ "${CHECK_STATUS[$check]}" = "FAIL" ]; then
              HAS_FAIL="true"
            elif [ "${CHECK_STATUS[$check]}" = "WARN" ]; then
              HAS_WARN="true"
            fi
          done

          if [ "$HAS_FAIL" = "true" ]; then
            OVERALL="🚨 CRITICAL ALERTS"
          elif [ "$HAS_WARN" = "true" ]; then
            OVERALL="⚠️ WARNINGS DETECTED"
          else
            OVERALL="✅ ALL SECURE"
          fi

          echo "overall=$OVERALL" >> $GITHUB_OUTPUT

          cat > email_body.html <<'HTML_RENDER_START'
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="utf-8">
          <style>
            /* Fallback for clients that respect style tags */
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
            body, .body-wrap { background-color: #000000 !important; font-family: 'SF Pro Display', 'Inter', -apple-system, system-ui, sans-serif !important; margin: 0; padding: 0; }
          </style>
          </head>
          <body style="background-color: #000000; margin: 0; padding: 24px;">
          <div class="body-wrap" style="background-color: #000000; min-height: 100vh; padding: 24px; font-family: 'SF Pro Display', 'Inter', -apple-system, system-ui, sans-serif;">
            <div style="max-width: 680px; margin: 0 auto; background-color: #0A0A0A; border: 1px solid #262626; border-radius: 16px; overflow: hidden; color: #FAFAFA;">
              
              <!-- Header -->
              <div style="padding: 32px; text-align: center; border-bottom: 1px solid #262626; background-color: #050505;">
                <img src="https://raw.githubusercontent.com/rofiperlungoding/CatCoder/main/public/logo.png" alt="CatCoder Logo" style="height: 48px; margin-bottom: 16px; display: block; margin-left: auto; margin-right: auto;">
                <h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: #FAFAFA !important;">Universal CI/CD Report</h1>
                <p style="margin: 8px 0 0; color: #A3A3A3 !important; font-size: 14px; line-height: 1.5;">Branch: HTML_INJECT_BRANCH &bull; Commit: HTML_INJECT_COMMIT<br>Time: HTML_INJECT_TIME UTC</p>
              </div>

              <!-- Content Body -->
              <div style="padding: 32px; background-color: #0A0A0A;">
          HTML_RENDER_START

          # Replace Variables
          sed -i "s|HTML_INJECT_BRANCH|${GITHUB_REF_NAME}|g" email_body.html
          sed -i "s|HTML_INJECT_COMMIT|${GITHUB_SHA:0:7}|g" email_body.html
          sed -i "s|HTML_INJECT_TIME|$(date -u '+%Y-%m-%d %H:%M')|g" email_body.html

          if [ "$HAS_FAIL" = "true" ]; then
            cat >> email_body.html <<'EOF'
                <div style="padding: 16px 20px; border-radius: 12px; margin-bottom: 24px; border-left: 4px solid #ef4444; background-color: rgba(239, 68, 68, 0.1);">
                  <h2 style="margin: 0 0 8px 0; font-size: 18px; color: #ef4444 !important; font-weight: 700;">🚨 CI Pipeline Failed</h2>
                  <p style="margin: 0; font-size: 14px; color: #d4d4d4 !important; line-height: 1.5;">One or more security, logic, or build checks have failed. Pipeline halted. Immediate fix is required before safely merging code to main.</p>
                </div>
          EOF
          elif [ "$HAS_WARN" = "true" ]; then
            cat >> email_body.html <<'EOF'
                <div style="padding: 16px 20px; border-radius: 12px; margin-bottom: 24px; border-left: 4px solid #f59e0b; background-color: rgba(245, 158, 11, 0.1);">
                  <h2 style="margin: 0 0 8px 0; font-size: 18px; color: #f59e0b !important; font-weight: 700;">⚠️ Pipeline Passed with Warnings</h2>
                  <p style="margin: 0; font-size: 14px; color: #d4d4d4 !important; line-height: 1.5;">The code is valid and deployable, but there are non-critical issues that should be reviewed (e.g., bundle size limits, minor NPM vulnerabilities).</p>
                </div>
          EOF
          else
            cat >> email_body.html <<'EOF'
                <div style="padding: 16px 20px; border-radius: 12px; margin-bottom: 24px; border-left: 4px solid #84cc16; background-color: rgba(132, 204, 22, 0.1);">
                  <h2 style="margin: 0 0 8px 0; font-size: 18px; color: #84cc16 !important; font-weight: 700;">✅ All Checks Passed</h2>
                  <p style="margin: 0; font-size: 14px; color: #E5E5E5 !important; line-height: 1.5;">The codebase is pristine. No security vulnerabilities, lint issues, logic bypasses, or build flaws detected. Good to deploy!</p>
                </div>
          EOF
          fi

          cat >> email_body.html <<'EOF'
                <div style="font-size: 18px; font-weight: 600; margin: 32px 0 16px 0; padding-bottom: 8px; border-bottom: 1px solid #262626; color: #FAFAFA !important;">Workflow Summary</div>
                <table style="width: 100%; border-collapse: collapse; margin-bottom: 32px;">
                  <tr>
                    <th style="text-align: left; padding: 12px; color: #A3A3A3 !important; border-bottom: 1px solid #262626; font-size: 14px; font-weight: 600;">Domain</th>
                    <th style="text-align: left; padding: 12px; color: #A3A3A3 !important; border-bottom: 1px solid #262626; font-size: 14px; font-weight: 600;">Test Spec</th>
                    <th style="text-align: center; padding: 12px; color: #A3A3A3 !important; border-bottom: 1px solid #262626; font-size: 14px; font-weight: 600;">Status</th>
                  </tr>
          EOF

          icon() { [ "$1" = "FAIL" ] && echo "<span style=\"display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background-color: rgba(239, 68, 68, 0.2); color: #ef4444 !important;\">FAIL</span>" || ([ "$1" = "WARN" ] && echo "<span style=\"display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background-color: rgba(245, 158, 11, 0.2); color: #f59e0b !important;\">WARN</span>" || echo "<span style=\"display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background-color: rgba(132, 204, 22, 0.2); color: #84cc16 !important;\">PASS</span>"); }

          cat >> email_body.html <<EOF
                  <tr>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #E5E5E5 !important;">Dependency</td>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #A3A3A3 !important;">NPM Security Audit</td>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; text-align: center;">$(icon "${{ steps.npm_audit.outputs.status }}")</td>
                  </tr>
                  <tr>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #E5E5E5 !important;">Secret</td>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #A3A3A3 !important;">Gitleaks Scan</td>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; text-align: center;">$(icon "${{ steps.gitleaks_result.outputs.status }}")</td>
                  </tr>
                  <tr>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #E5E5E5 !important;">Frontend</td>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #A3A3A3 !important;">ESLint Strict</td>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; text-align: center;">$(icon "${{ steps.lint.outputs.status }}")</td>
                  </tr>
                  <tr>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #E5E5E5 !important;">Frontend</td>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #A3A3A3 !important;">TypeScript Checker</td>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; text-align: center;">$(icon "${{ steps.typecheck.outputs.status }}")</td>
                  </tr>
                  <tr>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #E5E5E5 !important;">Frontend</td>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #A3A3A3 !important;">Vitest Security Pentest</td>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; text-align: center;">$(icon "${{ steps.pentest.outputs.status }}")</td>
                  </tr>
                  <tr>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #E5E5E5 !important;">Frontend</td>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #A3A3A3 !important;">Vite Prod Build</td>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; text-align: center;">$(icon "${{ steps.build.outputs.status }}")</td>
                  </tr>
                  <tr>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #E5E5E5 !important;">Python</td>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #A3A3A3 !important;">Ruff Linter</td>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; text-align: center;">$(icon "${{ steps.ruff.outputs.status }}")</td>
                  </tr>
                  <tr>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #E5E5E5 !important;">Python</td>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #A3A3A3 !important;">MyPy Typing</td>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; text-align: center;">$(icon "${{ steps.mypy.outputs.status }}")</td>
                  </tr>
                  <tr>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #E5E5E5 !important;">Python</td>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #A3A3A3 !important;">Bandit Sec Scan</td>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; text-align: center;">$(icon "${{ steps.bandit.outputs.status }}")</td>
                  </tr>
                  <tr>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #E5E5E5 !important;">Python</td>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; color: #A3A3A3 !important;">Logic Fuzzing</td>
                    <td style="padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; text-align: center;">$(icon "${{ steps.fuzz.outputs.status }}")</td>
                  </tr>
                </table>
          EOF

          if [ "$HAS_FAIL" = "true" ] || [ "$HAS_WARN" = "true" ]; then
            echo "<div style=\"font-size: 18px; font-weight: 600; margin: 32px 0 16px 0; padding-bottom: 8px; border-bottom: 1px solid #262626; color: #FAFAFA !important;\">Detailed Diagnostics & Mitigation</div>" >> email_body.html
          fi

          block_start() {
            local TITLE=$1
            local ICON_HTML=$2
            cat >> email_body.html <<          EOF
                <details style="background: #171717; border: 1px solid #262626; border-radius: 12px; margin-bottom: 16px; overflow: hidden; color: #FAFAFA !important;">
                  <summary style="padding: 16px; cursor: pointer; font-weight: 600; background: #1e1e1e; font-size: 15px; outline: none; color: #FAFAFA !important;">${TITLE} ${ICON_HTML}</summary>
                  <div style="padding: 16px; border-top: 1px solid #262626; font-size: 14px; color: #D4D4D4 !important; line-height: 1.5; background: #171717;">
          EOF
          }
          block_end() {
            cat >> email_body.html <<          EOF
                  </div>
                </details>
          EOF
          }

          if [ "${{ steps.npm_audit.outputs.status }}" != "PASS" ]; then
            block_start "📦 NPM Security Audit" "$(icon "${{ steps.npm_audit.outputs.status }}")"
            cat >> email_body.html <<          EOF
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Metrics / Status</h3>
                    <ul style="margin: 0 0 16px 0; padding-left: 20px; color: #E5E5E5 !important;"><li style="margin-bottom: 4px;">Critical: ${{ steps.npm_audit.outputs.critical }}, High: ${{ steps.npm_audit.outputs.high }}, Moderate: ${{ steps.npm_audit.outputs.moderate }}</li></ul>
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Vulnerability Impact</h3>
                    <p style="margin: 0 0 16px 0; color: #d4d4d4 !important;">Vulnerable dependencies can lead to exploitation vectors like XSS, Prototype Pollution, and RCE. Critical issues mean the app is actively susceptible to CVE exploits published on the Node ecosystem.</p>
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Mitigation Instructions</h3>
                    <p style="margin: 0; color: #d4d4d4 !important;">Open CatCoder project. Run <code style="background: #262626; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #84cc16 !important;">npm audit fix</code> in your local environment shell. If breaking changes occur or manual review is needed, run <code style="background: #262626; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #84cc16 !important;">npm audit</code> to identify the vulnerable package and deliberately upgrade its version inside <code style="background: #262626; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #e5e5e5 !important;">package.json</code>.</p>
          EOF
            block_end
          fi

          if [ "${{ steps.gitleaks_result.outputs.status }}" = "FAIL" ]; then
            block_start "🕵️ Gitleaks Secrets Scan" "$(icon "FAIL")"
            cat >> email_body.html <<          EOF
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Issue Description</h3>
                    <p style="margin: 0 0 16px 0; color: #d4d4d4 !important;">Hardcoded secrets (e.g. Supabase anon key, OpenAI API Keys, Firebase config, or Passwords) were detected inside pushed repository files.</p>
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Catastrophic Impact</h3>
                    <p style="margin: 0 0 16px 0; color: #d4d4d4 !important;">A catastrophic failure. Actors and automated web scrapers can harvest these access tokens granting them full exploit privileges to your Supabase, Firebase, or OpenAI developer accounts causing huge service bills and malicious data exfiltration.</p>
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Mitigation Instructions</h3>
                    <p style="margin: 0; color: #d4d4d4 !important;">1. <strong>Revoke</strong> the leaked keys immediately within their respective platform dashboards.<br>2. Migrate usage to environment variables (e.g., <code style="background: #262626; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #e5e5e5 !important;">import.meta.env</code>) and make sure they are included in <code style="background: #262626; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #e5e5e5 !important;">.gitignore</code>.<br>3. Overwrite the git history using <code style="background: #262626; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #e5e5e5 !important;">git filter-repo</code> if credentials must not be seen in historical commits.</p>
          EOF
            block_end
          fi

          if [ "${{ steps.lint.outputs.status }}" != "PASS" ]; then
            block_start "📏 ESLint Code Quality" "$(icon "${{ steps.lint.outputs.status }}")"
            cat >> email_body.html <<          EOF
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Metrics / Status</h3>
                    <ul style="margin: 0 0 16px 0; padding-left: 20px; color: #E5E5E5 !important;"><li style="margin-bottom: 4px;">Syntax Errors: ${{ steps.lint.outputs.errors }}, Warnings: ${{ steps.lint.outputs.warnings }}</li></ul>
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Defect Impact</h3>
                    <p style="margin: 0 0 16px 0; color: #d4d4d4 !important;">Poor syntax, unreachable code, unhandled async states, and violations of React Hooks rules heavily degrade software maintainability. This directly correlates to runtime memory leaks or UI bugs.</p>
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Mitigation Instructions</h3>
                    <p style="margin: 0; color: #d4d4d4 !important;">Review the GitHub Action logs for specific file targets. Quickly correct these by running <code style="background: #262626; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #84cc16 !important;">npm run lint -- --fix</code> locally, or manually inspecting your VSCode problem tab.</p>
          EOF
            block_end
          fi

          if [ "${{ steps.typecheck.outputs.status }}" = "FAIL" ]; then
            block_start "🔧 TypeScript Checker" "$(icon "FAIL")"
            cat >> email_body.html <<          EOF
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Metrics / Status</h3>
                    <ul style="margin: 0 0 16px 0; padding-left: 20px; color: #E5E5E5 !important;"><li style="margin-bottom: 4px;">Type Conflicts: ${{ steps.typecheck.outputs.errors }}</li></ul>
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Defect Impact</h3>
                    <p style="margin: 0 0 16px 0; color: #d4d4d4 !important;">Type mismatches imply the runtime assumes one variable topology but encounters another—an absolute recipe for <code style="background: #262626; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #e5e5e5 !important;">undefined is not a function</code> errors destroying production client interfaces.</p>
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Mitigation Instructions</h3>
                    <p style="margin: 0; color: #d4d4d4 !important;">Execute <code style="background: #262626; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #84cc16 !important;">npx tsc -b</code> locally to view compiler complaints. Inject proper TypeScript Interface bounds or strict type guards (e.g., optional chaining and Null checks) onto flagged logic.</p>
          EOF
            block_end
          fi

          if [ "${{ steps.pentest.outputs.status }}" = "FAIL" ]; then
            block_start "⚔️ Vitest Security Pentest" "$(icon "FAIL")"
            cat >> email_body.html <<          EOF
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Metrics / Status</h3>
                    <ul style="margin: 0 0 16px 0; padding-left: 20px; color: #E5E5E5 !important;"><li style="margin-bottom: 4px;">Breaches (Failed): ${{ steps.pentest.outputs.failed }} | Passed Integrations: ${{ steps.pentest.outputs.passed }}</li></ul>
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Exploitation Impact</h3>
                    <p style="margin: 0 0 16px 0; color: #d4d4d4 !important;">The core logic sandbox (checking malicious network imports or system-call mutations) was successfully bypassed or failed to properly isolate bounds. The web environment constitutes a high-risk vector against arbitrary JS payload attacks.</p>
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Mitigation Instructions</h3>
                    <p style="margin: 0; color: #d4d4d4 !important;">Trigger <code style="background: #262626; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #84cc16 !important;">npm run test</code> bounds locally to emulate the exploit that bypasses the firewall. Strengthen standard DOM validation sanitizations and check AST logic parsers.</p>
          EOF
            block_end
          fi

          if [ "${{ steps.build.outputs.status }}" != "PASS" ]; then
            block_start "🏗️ Vite Production Build" "$(icon "${{ steps.build.outputs.status }}")"
            cat >> email_body.html <<          EOF
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Issue Description</h3>
                    <p style="margin: 0 0 16px 0; color: #d4d4d4 !important;">$([ "${{ steps.build.outputs.status }}" = "FAIL" ] && echo "Vite compiler failed to emit assets. Pipeline crashed on AST tree manipulation." || echo "Build succeeded, but the bundle chunk size is unusually bloated (${{ steps.build.outputs.bundle_size }}MB).")</p>
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Performance & Deployment Impact</h3>
                    <p style="margin: 0 0 16px 0; color: #d4d4d4 !important;">$([ "${{ steps.build.outputs.status }}" = "FAIL" ] && echo "A hard blocker. The system cannot be reliably deployed or packaged to hosting providers like Cloudflare/Vercel." || echo "Extreme load times on low-bandwidth user devices and heavy SEO penalization. Client CPUs will struggle rendering large JS payloads.")</p>
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Mitigation Instructions</h3>
                    <p style="margin: 0; color: #d4d4d4 !important;">$([ "${{ steps.build.outputs.status }}" = "FAIL" ] && echo "Check missing file paths, non-resolvable TS dependencies, or misconfigured vite plugins in vite.config.ts." || echo "Analyze chunk splitting logic, defer/lazy-load huge dependencies via React.lazy(), or manually optimize high-weight library imports.")</p>
          EOF
            block_end
          fi

          if [ "${{ steps.ruff.outputs.status }}" = "FAIL" ]; then
            block_start "🐍 Python Ruff" "$(icon "FAIL")"
            cat >> email_body.html <<          EOF
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Defect Impact</h3>
                    <p style="margin: 0 0 16px 0; color: #d4d4d4 !important;">Syntax smells or inconsistent PEP-8 formatting degrades readability and standardizations across your server code.</p>
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Mitigation Instructions</h3>
                    <p style="margin: 0; color: #d4d4d4 !important;">Automatically fix issues locally using <code style="background: #262626; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #84cc16 !important;">ruff check . --fix</code>.</p>
          EOF
            block_end
          fi
          
          if [ "${{ steps.mypy.outputs.status }}" = "FAIL" ]; then
            block_start "🐍 Python MyPy" "$(icon "FAIL")"
            cat >> email_body.html <<          EOF
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Defect Impact</h3>
                    <p style="margin: 0 0 16px 0; color: #d4d4d4 !important;">Dynamic variable type mutation without proper type annotations. Causes unpredictable errors during runtime logic execution.</p>
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Mitigation Instructions</h3>
                    <p style="margin: 0; color: #d4d4d4 !important;">Run <code style="background: #262626; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #84cc16 !important;">mypy src/lib/secure_core.py</code> locally and correct type hints where expected object inputs differ.</p>
          EOF
            block_end
          fi
          
          if [ "${{ steps.bandit.outputs.status }}" = "FAIL" ]; then
            block_start "🔒 Python Bandit" "$(icon "FAIL")"
            cat >> email_body.html <<          EOF
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Exploitation Impact</h3>
                    <p style="margin: 0 0 16px 0; color: #d4d4d4 !important;">Severe vulnerability. The tool spotted common injection flanks like OS command injection (<code style="background: #262626; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #e5e5e5 !important;">subprocess.run(shell=True)</code>), insecure use of <code style="background: #262626; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #e5e5e5 !important;">eval()</code>, hardcoded hashes, or weak cryptographic derivations.</p>
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Mitigation Instructions</h3>
                    <p style="margin: 0; color: #d4d4d4 !important;">Run <code style="background: #262626; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #84cc16 !important;">bandit -r ./</code> in CLI. Refactor the problematic code out immediately using safer standard-library bindings.</p>
          EOF
            block_end
          fi

          if [ "${{ steps.fuzz.outputs.status }}" = "FAIL" ]; then
            block_start "🎲 Python Logic Fuzzing" "$(icon "FAIL")"
            cat >> email_body.html <<          EOF
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Exploitation Impact</h3>
                    <p style="margin: 0 0 16px 0; color: #d4d4d4 !important;">Code breaks heavily upon ingestion of edge-case/random inputs. Lack of constraint handlers means bad actors can easily crash backend processes and force restarts.</p>
                    <h3 style="font-size: 12px; margin: 0 0 8px 0; color: #A3A3A3 !important; text-transform: uppercase; letter-spacing: 0.05em;">Mitigation Instructions</h3>
                    <p style="margin: 0; color: #d4d4d4 !important;">Apply stringent bounds checking, implement defensive <code style="background: #262626; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #84cc16 !important;">try-except</code> blocks, and reject malformed API parameters extremely early.</p>
          EOF
            block_end
          fi

          cat >> email_body.html <<'EOF'
              </div>
              
              <!-- Footer -->
              <div style="background-color: #050505; border-top: 1px solid #262626; padding: 24px; text-align: center; color: #737373 !important; font-size: 13px;">
                <strong style="color: #A3A3A3 !important;">CatCoder DevSecOps Intelligence</strong><br>
                An automated continuous integration pipeline engineered for absolute resilience.<br><br>
                <span style="color: #525252 !important;">Powered by Deepmind System</span>
              </div>
              
            </div>
          </div>
          </body>
          </html>
          EOF

      # ── Send Final Report Email ──
      - name: "📧 Send Comprehensive Email"
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ steps.report.outputs.overall }} — CatCoder CI [${{ github.ref_name }}]"
          html_body: file://email_body.html
          to: opikopi32@gmail.com, mrofid@student.ub.ac.id
          from: "CatCoder Guardian <${{ secrets.MAIL_USERNAME }}>"

      # ── Final Verdict ──
      - name: "🏁 Final Verdict"
        if: always()
        run: |
          if [ "${{ steps.npm_audit.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.gitleaks_result.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.lint.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.typecheck.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.pentest.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.ruff.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.mypy.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.bandit.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.fuzz.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.build.outputs.status }}" = "FAIL" ]; then
            echo "🚨 PIPELINE OVERALL FAILED — Fix critical issues above."
            exit 1
          fi
          echo "✅ ALL PIPELINES CLEAR."

  release:
    name: "📦 Create GitHub Release"
    needs: validate-all
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-assets
          path: dist/

      - name: Archive Assets
        run: zip -r release-assets.zip dist/ sbom.json

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
