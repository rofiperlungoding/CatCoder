name: "🚀 Universal CI/CD Pipeline"

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  validate-all:
    name: "🛡️ Setup, Security, Quality & Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── Inject Env ──
      - name: Inject Secure Environment Variables
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY }}
          VITE_STORAGE_ENCRYPTION_KEY: ${{ secrets.VITE_STORAGE_ENCRYPTION_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> .env
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> .env
          echo "VITE_OPENAI_API_KEY=$VITE_OPENAI_API_KEY" >> .env
          echo "VITE_STORAGE_ENCRYPTION_KEY=$VITE_STORAGE_ENCRYPTION_KEY" >> .env
          echo "VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID" >> .env
          echo "VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID" >> .env

      # ── Setup Runtimes ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── Install Dependencies ──
      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Quality Tools
        run: pip install ruff mypy pydantic safety bandit

      # ══════════════════════════════════════════
      #  CHECK 1: Supply Chain (NPM Audit)
      # ══════════════════════════════════════════
      - name: "🔍 NPM Security Audit"
        id: npm_audit
        continue-on-error: true
        run: |
          set +e
          npm audit --json > audit_raw.json 2>&1 || true
          set -e
          CRITICAL=$(cat audit_raw.json | jq '.metadata.vulnerabilities.critical // 0' 2>/dev/null || true)
          [ -z "$CRITICAL" ] && CRITICAL=0
          HIGH=$(cat audit_raw.json | jq '.metadata.vulnerabilities.high // 0' 2>/dev/null || true)
          [ -z "$HIGH" ] && HIGH=0
          MODERATE=$(cat audit_raw.json | jq '.metadata.vulnerabilities.moderate // 0' 2>/dev/null || true)
          [ -z "$MODERATE" ] && MODERATE=0
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "moderate=$MODERATE" >> $GITHUB_OUTPUT
          if [ "$CRITICAL" -gt 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          elif [ "$HIGH" -gt 0 ]; then
            echo "status=WARN" >> $GITHUB_OUTPUT
          elif [ "$MODERATE" -gt 0 ]; then
            echo "status=WARN" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 2: Secrets Leakage Scan (Gitleaks)
      # ══════════════════════════════════════════
      - name: "🕵️ Secrets Leakage Scan"
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record Gitleaks Result
        if: always()
        id: gitleaks_result
        run: |
          if [ "${{ steps.gitleaks.outcome }}" = "failure" ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 3: ESLint (Frontend)
      # ══════════════════════════════════════════
      - name: "📏 ESLint — Zero Tolerance"
        id: lint
        continue-on-error: true
        run: |
          set +e
          npm run lint 2>&1 | tee lint_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          WARNINGS=$(grep -c "warning" lint_output.txt 2>/dev/null || true)
          [ -z "$WARNINGS" ] && WARNINGS=0
          ERRORS=$(grep -c " error " lint_output.txt 2>/dev/null || true)
          [ -z "$ERRORS" ] && ERRORS=0
          echo "warnings=${WARNINGS}" >> $GITHUB_OUTPUT
          echo "errors=${ERRORS}" >> $GITHUB_OUTPUT
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          elif [ "$WARNINGS" -gt 0 ]; then
            echo "status=WARN" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 4: TypeScript (Frontend)
      # ══════════════════════════════════════════
      - name: "🔧 TypeScript Strict Check"
        id: typecheck
        continue-on-error: true
        run: |
          set +e
          npx tsc -b 2>&1 | tee typecheck_output.txt
          EXIT_CODE=$?
          set -e
          TS_ERRORS=$(grep -c "error TS" typecheck_output.txt 2>/dev/null || true)
          [ -z "$TS_ERRORS" ] && TS_ERRORS=0
          echo "errors=${TS_ERRORS}" >> $GITHUB_OUTPUT
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 5: Pentest Suite
      # ══════════════════════════════════════════
      - name: "⚔️ Pentest Suite"
        id: pentest
        continue-on-error: true
        run: |
          set +e
          npx vitest run --config vitest.pentest.config.ts 2>&1 | tee pentest_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          PASSED=$(grep -oP '\d+(?=\s+passed)' pentest_output.txt | head -1 || true)
          [ -z "$PASSED" ] && PASSED=0
          FAILED=$(grep -oP '\d+(?=\s+failed)' pentest_output.txt | head -1 || true)
          [ -z "$FAILED" ] && FAILED=0
          echo "passed=${PASSED}" >> $GITHUB_OUTPUT
          echo "failed=${FAILED}" >> $GITHUB_OUTPUT
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 6: Python Linting (Ruff)
      # ══════════════════════════════════════════
      - name: "📏 Python Linting (Ruff)"
        id: ruff
        continue-on-error: true
        run: |
          set +e
          ruff check src/lib/secure_core.py 2>&1 | tee ruff_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 7: Python Type Safety (MyPy)
      # ══════════════════════════════════════════
      - name: "🔧 Python Type Safety (MyPy)"
        id: mypy
        continue-on-error: true
        run: |
          set +e
          mypy src/lib/secure_core.py 2>&1 | tee mypy_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 8: Python Security Audit (Bandit)
      # ══════════════════════════════════════════
      - name: "🔒 Python Security Audit (Bandit)"
        id: bandit
        continue-on-error: true
        run: |
          set +e
          bandit src/lib/secure_core.py 2>&1 | tee bandit_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 9: Python Logic Fuzzing
      # ══════════════════════════════════════════
      - name: "🎲 Python Logic Fuzzing"
        id: fuzz
        continue-on-error: true
        run: |
          set +e
          python src/lib/fuzz_logic.py 2>&1 | tee fuzz_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "status=PASS" >> $GITHUB_OUTPUT
          fi

      # ══════════════════════════════════════════
      #  CHECK 10: Production Build Verification
      # ══════════════════════════════════════════
      - name: "🏗️ Production Build Verification"
        id: build
        continue-on-error: true
        run: |
          set +e
          npm run build 2>&1 | tee build_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            TOTAL_SIZE=$(du -sb dist/ | cut -f1)
            SIZE_MB=$(echo "scale=2; $TOTAL_SIZE / 1048576" | bc)
            echo "bundle_size=${SIZE_MB}MB" >> $GITHUB_OUTPUT
            if (( $(echo "$SIZE_MB > 5.0" | bc -l) )); then
              echo "status=WARN" >> $GITHUB_OUTPUT
            else
              echo "status=PASS" >> $GITHUB_OUTPUT
            fi
          fi

      # ══════════════════════════════════════════
      #  CHECK 11: Generate SBOM
      # ══════════════════════════════════════════
      - name: "📦 Generate SBOM"
        uses: anchore/sbom-action@v0
        with:
          format: 'cyclonedx-json'
          output-file: 'sbom.json'

      # ── Upload Artifacts ──
      - name: Upload Build Artifacts
        if: steps.build.outputs.status != 'FAIL'
        uses: actions/upload-artifact@v4
        with:
          name: production-assets
          path: |
            dist/
            sbom.json

      # ── Generate Report ──
      - name: "📋 Generate Comprehensive Report"
        if: always()
        id: report
        run: |
          HAS_FAIL="false"
          HAS_WARN="false"

          declare -A CHECK_STATUS
          CHECK_STATUS[npm_audit]="${{ steps.npm_audit.outputs.status }}"
          CHECK_STATUS[gitleaks]="${{ steps.gitleaks_result.outputs.status }}"
          CHECK_STATUS[lint]="${{ steps.lint.outputs.status }}"
          CHECK_STATUS[typecheck]="${{ steps.typecheck.outputs.status }}"
          CHECK_STATUS[pentest]="${{ steps.pentest.outputs.status }}"
          CHECK_STATUS[ruff]="${{ steps.ruff.outputs.status }}"
          CHECK_STATUS[mypy]="${{ steps.mypy.outputs.status }}"
          CHECK_STATUS[bandit]="${{ steps.bandit.outputs.status }}"
          CHECK_STATUS[fuzz]="${{ steps.fuzz.outputs.status }}"
          CHECK_STATUS[build]="${{ steps.build.outputs.status }}"

          for check in "${!CHECK_STATUS[@]}"; do
            if [ "${CHECK_STATUS[$check]}" = "FAIL" ]; then
              HAS_FAIL="true"
            elif [ "${CHECK_STATUS[$check]}" = "WARN" ]; then
              HAS_WARN="true"
            fi
          done

          if [ "$HAS_FAIL" = "true" ]; then
            OVERALL="🚨 CRITICAL ALERTS"
          elif [ "$HAS_WARN" = "true" ]; then
            OVERALL="⚠️ WARNINGS DETECTED"
          else
            OVERALL="✅ ALL SECURE"
          fi

          echo "overall=$OVERALL" >> $GITHUB_OUTPUT

          cat > email_body.html <<'HTML_RENDER_START'
          <!DOCTYPE html>
          <html>
          <head>
          <style>
            :root {
              --bg: #0a0a0a;
              --card: #171717;
              --border: #262626;
              --text: #fafafa;
              --muted: #a3a3a3;
              --primary: #84cc16;
              --destructive: #ef4444;
              --warning: #f59e0b;
            }
            body {
              font-family: 'SF Pro Display', -apple-system, system-ui, sans-serif;
              background-color: #000000;
              color: #fafafa;
              padding: 24px;
              margin: 0;
            }
            .container {
              max-width: 680px;
              margin: 0 auto;
              background-color: #0a0a0a;
              border: 1px solid #262626;
              border-radius: 16px;
              overflow: hidden;
            }
            .header {
              padding: 32px;
              text-align: center;
              border-bottom: 1px solid #262626;
              background-color: #050505;
            }
            .header img {
              height: 48px;
              margin-bottom: 16px;
            }
            .header h1 {
              margin: 0;
              font-size: 24px;
              font-weight: 700;
              letter-spacing: -0.02em;
              color: #fafafa;
            }
            .header p {
              margin: 8px 0 0;
              color: #a3a3a3;
              font-size: 14px;
            }
            .content {
              padding: 32px;
            }
            .alert {
              padding: 16px 20px;
              border-radius: 12px;
              margin-bottom: 24px;
              border-left: 4px solid;
            }
            .alert.fail { background-color: rgba(239, 68, 68, 0.1); border-color: #ef4444; }
            .alert.warn { background-color: rgba(245, 158, 11, 0.1); border-color: #f59e0b; }
            .alert.pass { background-color: rgba(132, 204, 22, 0.1); border-color: #84cc16; }
            .alert h2 { margin: 0 0 8px 0; font-size: 18px; }
            .alert p { margin: 0; font-size: 14px; color: #d4d4d4; }
            table { width: 100%; border-collapse: collapse; margin-bottom: 32px; }
            th { text-align: left; padding: 12px; color: #a3a3a3; border-bottom: 1px solid #262626; font-size: 14px; font-weight: 600; }
            td { padding: 14px 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; }
            details { background: #171717; border: 1px solid #262626; border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
            summary { padding: 16px; cursor: pointer; font-weight: 600; background: #1e1e1e; font-size: 15px; outline: none; }
            .details-content { padding: 16px; border-top: 1px solid #262626; font-size: 14px; color: #d4d4d4; line-height: 1.5; }
            .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
            .badge.fail { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
            .badge.warn { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
            .badge.pass { background: rgba(132, 204, 22, 0.2); color: #84cc16; }
            h3 { font-size: 14px; margin: 16px 0 8px 0; color: #fafafa; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.8; }
            ul { margin: 0; padding-left: 20px; }
            li { margin-bottom: 6px; }
            code { background: #262626; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #e5e5e5; }
            .section-title { font-size: 18px; font-weight: 600; margin: 32px 0 16px 0; padding-bottom: 8px; border-bottom: 1px solid #262626; color: #fafafa; }
          </style>
          </head>
          <body>
          <div class="container">
            <div class="header">
              <!-- Using raw github url to load CatCoder logo on Email Clients -->
              <img src="https://raw.githubusercontent.com/rofiperlungoding/CatCoder/main/public/logo.png" alt="CatCoder Logo">
              <h1>Universal CI/CD Report</h1>
              <p>Branch: HTML_INJECT_BRANCH • Commit: HTML_INJECT_COMMIT<br>Time: HTML_INJECT_TIME UTC</p>
            </div>
            <div class="content">
          HTML_RENDER_START

          # Replace Variables
          sed -i "s|HTML_INJECT_BRANCH|${GITHUB_REF_NAME}|g" email_body.html
          sed -i "s|HTML_INJECT_COMMIT|${GITHUB_SHA:0:7}|g" email_body.html
          sed -i "s|HTML_INJECT_TIME|$(date -u '+%Y-%m-%d %H:%M')|g" email_body.html

          if [ "$HAS_FAIL" = "true" ]; then
            cat >> email_body.html <<'EOF'
              <div class="alert fail">
                <h2 style="color: #ef4444;">🚨 CI Pipeline Failed</h2>
                <p>One or more security, logic, or build checks have failed. Pipeline halted. Immediate fix is required before safely merging code to main.</p>
              </div>
          EOF
          elif [ "$HAS_WARN" = "true" ]; then
            cat >> email_body.html <<'EOF'
              <div class="alert warn">
                <h2 style="color: #f59e0b;">⚠️ Pipeline Passed with Warnings</h2>
                <p>The code is valid and deployable, but there are non-critical issues that should be reviewed (e.g., bundle size limits, minor NPM vulnerabilities).</p>
              </div>
          EOF
          else
            cat >> email_body.html <<'EOF'
              <div class="alert pass">
                <h2 style="color: #84cc16;">✅ All Checks Passed</h2>
                <p>The codebase is pristine. No security vulnerabilities, lint issues, logic bypasses, or build flaws detected. Good to deploy!</p>
              </div>
          EOF
          fi

          cat >> email_body.html <<'EOF'
              <div class="section-title">Workflow Summary</div>
              <table>
                <tr><th>Domain</th><th>Test Spec</th><th>Status</th></tr>
          EOF

          icon() { [ "$1" = "FAIL" ] && echo "<span class='badge fail'>FAIL</span>" || ([ "$1" = "WARN" ] && echo "<span class='badge warn'>WARN</span>" || echo "<span class='badge pass'>PASS</span>"); }

          cat >> email_body.html <<EOF
                <tr><td>Dependency</td><td>NPM Security Audit</td><td>$(icon "${{ steps.npm_audit.outputs.status }}")</td></tr>
                <tr><td>Secret</td><td>Gitleaks Scan</td><td>$(icon "${{ steps.gitleaks_result.outputs.status }}")</td></tr>
                <tr><td>Frontend</td><td>ESLint Strict</td><td>$(icon "${{ steps.lint.outputs.status }}")</td></tr>
                <tr><td>Frontend</td><td>TypeScript Checker</td><td>$(icon "${{ steps.typecheck.outputs.status }}")</td></tr>
                <tr><td>Frontend</td><td>Vitest Security Pentest</td><td>$(icon "${{ steps.pentest.outputs.status }}")</td></tr>
                <tr><td>Frontend</td><td>Vite Prod Build</td><td>$(icon "${{ steps.build.outputs.status }}")</td></tr>
                <tr><td>Python</td><td>Ruff Linter</td><td>$(icon "${{ steps.ruff.outputs.status }}")</td></tr>
                <tr><td>Python</td><td>MyPy Typing</td><td>$(icon "${{ steps.mypy.outputs.status }}")</td></tr>
                <tr><td>Python</td><td>Bandit Sec Scan</td><td>$(icon "${{ steps.bandit.outputs.status }}")</td></tr>
                <tr><td>Python</td><td>Logic Fuzzing</td><td>$(icon "${{ steps.fuzz.outputs.status }}")</td></tr>
              </table>
          EOF

          if [ "$HAS_FAIL" = "true" ] || [ "$HAS_WARN" = "true" ]; then
            echo "<div class='section-title'>Detailed Diagnostics & Mitigation</div>" >> email_body.html
          fi

          # Detailed Impact and Mitigation Blocks utilizing details/summary native HTML5
          if [ "${{ steps.npm_audit.outputs.status }}" != "PASS" ]; then
            cat >> email_body.html <<EOF
              <details>
                <summary>📦 NPM Security Audit ($(icon "${{ steps.npm_audit.outputs.status }}"))</summary>
                <div class="details-content">
                  <h3>Metrics / Status:</h3>
                  <ul><li>Critical: ${{ steps.npm_audit.outputs.critical }}, High: ${{ steps.npm_audit.outputs.high }}, Moderate: ${{ steps.npm_audit.outputs.moderate }}</li></ul>
                  <h3>Vulnerability Impact:</h3>
                  <p>Vulnerable dependencies can lead to exploitation vectors like XSS, Prototype Pollution, and RCE. Critical issues mean the app is actively susceptible to CVE exploits published on the Node ecosystem.</p>
                  <h3>Mitigation Instructions:</h3>
                  <p>Open CatCoder project. Run <code>npm audit fix</code> in your local environment shell. If breaking changes occur or manual review is needed, run <code>npm audit</code> to identify the vulnerable package and deliberately upgrade its version inside <code>package.json</code>.</p>
                </div>
              </details>
          EOF
          fi

          if [ "${{ steps.gitleaks_result.outputs.status }}" = "FAIL" ]; then
            cat >> email_body.html <<EOF
              <details>
                <summary>🕵️ Gitleaks Secrets Scan ($(icon "FAIL"))</summary>
                <div class="details-content">
                  <h3>Issue Description:</h3>
                  <p>Hardcoded secrets (e.g. Supabase anon key, OpenAI API Keys, Firebase config, or Passwords) were detected inside pushed repository files.</p>
                  <h3>Catastrophic Impact:</h3>
                  <p>A catastrophic failure. Actors and automated web scrapers can harvest these access tokens granting them full exploit privileges to your Supabase, Firebase, or OpenAI developer accounts causing huge service bills and malicious data exfiltration.</p>
                  <h3>Mitigation Instructions:</h3>
                  <p>1. <strong>Revoke</strong> the leaked keys immediately within their respective platform dashboards.<br>2. Migrate usage to environment variables (e.g., <code>import.meta.env</code>) and make sure they are included in <code>.gitignore</code>.<br>3. Overwrite the git history using <code>git filter-repo</code> if credentials must not be seen in historical commits.</p>
                </div>
              </details>
          EOF
          fi

          if [ "${{ steps.lint.outputs.status }}" != "PASS" ]; then
            cat >> email_body.html <<EOF
              <details>
                <summary>📏 ESLint Code Quality ($(icon "${{ steps.lint.outputs.status }}"))</summary>
                <div class="details-content">
                  <h3>Metrics / Status:</h3>
                  <ul><li>Syntax Errors: ${{ steps.lint.outputs.errors }}, Warnings: ${{ steps.lint.outputs.warnings }}</li></ul>
                  <h3>Defect Impact:</h3>
                  <p>Poor syntax, unreachable code, unhandled async states, and violations of React Hooks rules heavily degrade software maintainability. This directly correlates to runtime memory leaks or UI bugs.</p>
                  <h3>Mitigation Instructions:</h3>
                  <p>Review the GitHub Action logs for specific file targets. Quickly correct these by running <code>npm run lint -- --fix</code> locally, or manually inspecting your VSCode problem tab.</p>
                </div>
              </details>
          EOF
          fi

          if [ "${{ steps.typecheck.outputs.status }}" = "FAIL" ]; then
            cat >> email_body.html <<EOF
              <details>
                <summary>🔧 TypeScript Checker ($(icon "FAIL"))</summary>
                <div class="details-content">
                  <h3>Metrics / Status:</h3>
                  <ul><li>Type Conflicts: ${{ steps.typecheck.outputs.errors }}</li></ul>
                  <h3>Defect Impact:</h3>
                  <p>Type mismatches imply the runtime assumes one variable topology but encounters another—an absolute recipe for <code>undefined is not a function</code> errors destroying production client interfaces.</p>
                  <h3>Mitigation Instructions:</h3>
                  <p>Execute <code>npx tsc -b</code> locally to view compiler complaints. Inject proper TypeScript Interface bounds or strict type guards (e.g., optional chaining and Null checks) onto flagged logic.</p>
                </div>
              </details>
          EOF
          fi

          if [ "${{ steps.pentest.outputs.status }}" = "FAIL" ]; then
            cat >> email_body.html <<EOF
              <details>
                <summary>⚔️ Vitest Security Pentest ($(icon "FAIL"))</summary>
                <div class="details-content">
                  <h3>Metrics / Status:</h3>
                  <ul><li>Breaches (Failed): ${{ steps.pentest.outputs.failed }} | Passed Integrations: ${{ steps.pentest.outputs.passed }}</li></ul>
                  <h3>Exploitation Impact:</h3>
                  <p>The core logic sandbox (checking malicious network imports or system-call mutations) was successfully bypassed or failed to properly isolate bounds. The web environment constitutes a high-risk vector against arbitrary JS payload attacks.</p>
                  <h3>Mitigation Instructions:</h3>
                  <p>Trigger <code>npm run test</code> bounds locally to emulate the exploit that bypasses the firewall. Strengthen standard DOM validation sanitizations and check AST logic parsers.</p>
                </div>
              </details>
          EOF
          fi

          if [ "${{ steps.build.outputs.status }}" != "PASS" ]; then
            cat >> email_body.html <<EOF
              <details>
                <summary>🏗️ Vite Production Build ($(icon "${{ steps.build.outputs.status }}"))</summary>
                <div class="details-content">
                  <h3>Issue Description:</h3>
                  <p>$([ "${{ steps.build.outputs.status }}" = "FAIL" ] && echo "Vite compiler failed to emit assets. Pipeline crashed on AST tree manipulation." || echo "Build succeeded, but the bundle chunk size is unusually bloated (${{ steps.build.outputs.bundle_size }}MB).")</p>
                  <h3>Performance & Deployment Impact:</h3>
                  <p>$([ "${{ steps.build.outputs.status }}" = "FAIL" ] && echo "A hard blocker. The system cannot be reliably deployed or packaged to hosting providers like Cloudflare/Vercel." || echo "Extreme load times on low-bandwidth user devices and heavy SEO penalization. Client CPUs will struggle rendering large JS payloads.")</p>
                  <h3>Mitigation Instructions:</h3>
                  <p>$([ "${{ steps.build.outputs.status }}" = "FAIL" ] && echo "Check missing file paths, non-resolvable TS dependencies, or misconfigured vite plugins in vite.config.ts." || echo "Analyze chunk splitting logic, defer/lazy-load huge dependencies via React.lazy(), or manually optimize high-weight library imports.")</p>
                </div>
              </details>
          EOF
          fi

          if [ "${{ steps.ruff.outputs.status }}" = "FAIL" ]; then
            cat >> email_body.html <<EOF
              <details>
                <summary>🐍 Python Ruff ($(icon "FAIL"))</summary>
                <div class="details-content">
                  <h3>Defect Impact:</h3>
                  <p>Syntax smells or inconsistent PEP-8 formatting degrades readability and standardizations across your server code.</p>
                  <h3>Mitigation Instructions:</h3>
                  <p>Automatically fix issues locally using <code>ruff check . --fix</code>.</p>
                </div>
              </details>
          EOF
          fi
          
          if [ "${{ steps.mypy.outputs.status }}" = "FAIL" ]; then
            cat >> email_body.html <<EOF
              <details>
                <summary>🐍 Python MyPy ($(icon "FAIL"))</summary>
                <div class="details-content">
                  <h3>Defect Impact:</h3>
                  <p>Dynamic variable type mutation without proper type annotations. Causes unpredictable errors during runtime logic execution.</p>
                  <h3>Mitigation Instructions:</h3>
                  <p>Run <code>mypy src/lib/secure_core.py</code> locally and correct type hints where expected object inputs differ.</p>
                </div>
              </details>
          EOF
          fi
          
          if [ "${{ steps.bandit.outputs.status }}" = "FAIL" ]; then
            cat >> email_body.html <<EOF
              <details>
                <summary>🔒 Python Bandit ($(icon "FAIL"))</summary>
                <div class="details-content">
                  <h3>Exploitation Impact:</h3>
                  <p>Severe vulnerability. The tool spotted common injection flanks like OS command injection (<code>subprocess.run(shell=True)</code>), insecure use of <code>eval()</code>, hardcoded hashes, or weak cryptographic derivations.</p>
                  <h3>Mitigation Instructions:</h3>
                  <p>Run <code>bandit -r ./</code> in CLI. Refactor the problematic code out immediately using safer standard-library bindings.</p>
                </div>
              </details>
          EOF
          fi

          if [ "${{ steps.fuzz.outputs.status }}" = "FAIL" ]; then
            cat >> email_body.html <<EOF
              <details>
                <summary>🎲 Python Logic Fuzzing ($(icon "FAIL"))</summary>
                <div class="details-content">
                  <h3>Exploitation Impact:</h3>
                  <p>Code breaks heavily upon ingestion of edge-case/random inputs. Lack of constraint handlers means bad actors can easily crash backend processes and force restarts.</p>
                  <h3>Mitigation Instructions:</h3>
                  <p>Apply stringent bounds checking, implement defensive <code>try-except</code> blocks, and reject malformed API parameters extremely early.</p>
                </div>
              </details>
          EOF
          fi

          cat >> email_body.html <<'EOF'
            </div>
            <div style="background: #050505; border-top: 1px solid #262626; padding: 24px; text-align: center; color: #737373; font-size: 13px;">
              <strong>CatCoder DevSecOps Intelligence</strong><br>
              An automated continuous integration pipeline engineered for absolute resilience.<br><br>
              <span style="color: #404040;">Powered by Deepmind System</span>
            </div>
          </div>
          </body>
          </html>
          EOF

      # ── Send Final Report Email ──
      - name: "📧 Send Comprehensive Email"
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ steps.report.outputs.overall }} — CatCoder CI [${{ github.ref_name }}]"
          html_body: file://email_body.html
          to: opikopi32@gmail.com, mrofid@student.ub.ac.id
          from: "CatCoder Guardian <${{ secrets.MAIL_USERNAME }}>"

      # ── Final Verdict ──
      - name: "🏁 Final Verdict"
        if: always()
        run: |
          if [ "${{ steps.npm_audit.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.gitleaks_result.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.lint.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.typecheck.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.pentest.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.ruff.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.mypy.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.bandit.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.fuzz.outputs.status }}" = "FAIL" ] || \
             [ "${{ steps.build.outputs.status }}" = "FAIL" ]; then
            echo "🚨 PIPELINE OVERALL FAILED — Fix critical issues above."
            exit 1
          fi
          echo "✅ ALL PIPELINES CLEAR."

  release:
    name: "📦 Create GitHub Release"
    needs: validate-all
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-assets
          path: dist/

      - name: Archive Assets
        run: zip -r release-assets.zip dist/ sbom.json

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
