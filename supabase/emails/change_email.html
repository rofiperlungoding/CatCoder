<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Email Change</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body
    style="background-color: #000000; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #ffffff;">
    <table width="100%" border="0" cellpadding="0" cellspacing="0" style="background-color: #09090b;">
        <tr>
            <td align="center" style="padding: 40px 0;">
                <table width="600" border="0" cellpadding="0" cellspacing="0"
                    style="max-width: 600px; background-color: #18181b; border-radius: 24px; border: 1px solid #27272a; overflow: hidden;">
                    <!-- Decorative Header -->
                    <tr>
                        <td style="height: 8px; background: linear-gradient(to right, #fbbf24, #fcd34d);"></td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td style="padding: 48px 40px;">
                            <!-- Logo -->
                            <table border="0" cellpadding="0" cellspacing="0" style="margin-bottom: 32px;">
                                <tr>
                                    <td>
                                        <span
                                            style="font-size: 24px; font-weight: bold; color: #ffffff; letter-spacing: -0.5px;">
                                            🐱 CatCoder
                                        </span>
                                    </td>
                                </tr>
                            </table>

                            <!-- Heading -->
                            <h1
                                style="margin: 0 0 16px 0; font-size: 32px; font-weight: bold; color: #ffffff; letter-spacing: -1px;">
                                Confirm Email Change
                            </h1>

                            <!-- Body -->
                            <p style="margin: 0 0 32px 0; font-size: 16px; line-height: 26px; color: #a1a1aa;">
                                We received a request to change your email address. Please click the link below to
                                confirm this change.
                            </p>

                            <!-- Button -->
                            <table border="0" cellpadding="0" cellspacing="0" style="width: 100%; margin-bottom: 32px;">
                                <tr>
                                    <td>
                                        <a href="{{ .ConfirmationURL }}"
                                            style="display: inline-block; background-color: #fbbf24; color: #000000; font-size: 16px; font-weight: bold; text-decoration: none; padding: 16px 32px; border-radius: 9999px; box-shadow: 0 4px 6px -1px rgba(251, 191, 36, 0.2);">
                                            Confirm Change
                                        </a>
                                    </td>
                                </tr>
                            </table>

                            <p style="margin: 0; font-size: 14px; color: #71717a;">
                                If you didn't request this change, please contact support immediately.
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 32px 40px; background-color: #000000; border-top: 1px solid #27272a;">
                            <p style="margin: 0; font-size: 12px; color: #52525b; text-align: center;">
                                © 2024 CatCoder. All rights reserved.<br>
                                Sent with 💚 for coding.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
